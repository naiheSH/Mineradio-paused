name: CI

# Adapted from XxHuberrr/Mineradio-paused PR #473.
# Runs on this branch as well as main. Does not publish a release.

on:
  push:
    branches: [main, naihe]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22.x]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Node regression tests
        run: npm test
      - name: Static quick check
        run: npm run check:quick
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Syntax check build scripts
        run: node --check scripts/run-ci-tests.js && node --check scripts/verify-package.js && node --check desktop/main.js && node --check server.js && node --check public/js/modules/05-playback/03a-home-dashboard.js

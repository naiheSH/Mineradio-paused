# Draft release. Adapted from the release job in PR #404, without its other
# 15 workflows. Windows is the official installer. macOS arm64 is an unsigned
# DMG. Linux is an unsigned AppImage. Nothing here points at a fork release
# or rewrites the pause notice.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Which installers to build'
        type: choice
        options:
          - all
          - macos
        default: all

permissions:
  contents: read

concurrency:
  group: mineradio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "Version validated: $version"

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - run: npm test
      - run: npm run check:quick
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  build-windows:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Verify package
        run: node scripts/verify-package.js
      - name: SHA256
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap' }
          if (-not $files) { throw 'No Windows installer found in dist/' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned macOS arm64 DMG
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Verify package and hash
        run: |
          set -eu
          node scripts/verify-package.js
          files=(dist/*.dmg)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::No DMG found in dist/"
            exit 1
          fi
          shasum -a 256 "${files[@]}" > dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install Linux packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned Linux AppImage
        run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Verify package
        run: node scripts/verify-package.js
      - name: SHA256
        run: |
          set -eu
          files=(dist/*.AppImage)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::No AppImage found in dist/"
            exit 1
          fi
          sha256sum "${files[@]}" > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [build-windows, build-macos, build-linux]
    if: always() && needs.build-macos.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files and handwritten notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name 'SHA256SUMS-macos.txt' \) -exec cp -n {} release/ \;
          test -n "$(find release -name '*.dmg' -print -quit)"
          gh release download v2.3.0 --repo "${GITHUB_REPOSITORY}" --pattern 'Mineradio-2.3.0-Setup.exe*' --pattern 'Mineradio-2.3.0-linux-*' --pattern 'SHA256SUMS-windows.txt' --pattern 'SHA256SUMS-linux.txt' --dir release --clobber
          node scripts/extract-release-notes.js "${GITHUB_REF_NAME}"
          test -s release-notes.md
          grep -q '## 更新日志' release-notes.md
      - name: Update prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
          body_path: release-notes.md

name: Release

# Draft-only release. Adapted from the release job in PR #404, without its
# other 15 workflows. Windows is the official installer. macOS arm64 is an
# unsigned directory/DMG. Linux is an unsigned AppImage. Nothing here points
# at a fork release or rewrites the pause notice.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Keep the GitHub release as a draft'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mineradio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "Version validated: $version"

  test:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - run: npm test
      - run: npm run check:quick
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned Windows installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Verify package
        run: node scripts/verify-package.js
      - name: SHA256
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap' }
          if (-not $files) { throw 'No Windows installer found in dist/' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path dist/SHA256SUMS-windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned macOS arm64 app
        run: npm run build:mac:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Archive and hash
        run: |
          set -eu
          node scripts/verify-package.js
          ditto -c -k --keepParent dist/mac-arm64/Mineradio.app "dist/Mineradio-${{ github.ref_name }}-mac-arm64-unsigned.zip"
          shasum -a 256 "dist/Mineradio-${{ github.ref_name }}-mac-arm64-unsigned.zip" > dist/SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/Mineradio-*-mac-arm64-unsigned.zip
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install Linux packaging libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm
      - run: npm ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Build unsigned Linux AppImage
        run: npm run build:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
      - name: Verify package
        run: node scripts/verify-package.js
      - name: SHA256
        run: |
          set -eu
          files=(dist/*.AppImage)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::No AppImage found in dist/"
            exit 1
          fi
          sha256sum "${files[@]}" > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files and handwritten notes
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f -print -exec cp -n {} release/ \;
          node scripts/extract-release-notes.js "${GITHUB_REF_NAME}"
          test -s release-notes.md
          grep -q '## 更新日志' release-notes.md
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release/*
          body_path: release-notes.md
